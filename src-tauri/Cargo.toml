[package]
name = "ambientcg-downloader"
version = "0.1.1"
description = "Download and organise the entire AmbientCG library"
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
name = "ambientcg_downloader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.104"
futures = "0.3.34"
reqwest = { version = "0.13.5", features = ["stream", "json", "gzip"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.12.1", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8.1"
tokio = { version = "1.53.2", features = ["fs", "time", "macros", "rt-multi-thread", "io-util"] }
zip = "8.6.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel"] }
